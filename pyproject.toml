[project]
name = "f1-predictor"
version = "0.2.0"
description = "Chronological F1 finishing-order predictions with historical form and forecast weather"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastf1==3.8.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "requests>=2.32.3,<3",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "threadpoolctl>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pyyaml>=6.0.3",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
